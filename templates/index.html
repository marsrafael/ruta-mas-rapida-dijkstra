<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title> Empieza tu ruta | M.A.E </title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='image/logo.png') }}">

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/index.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/main.css') }}"
    />
  </head>
  <body class="__flex">
    <header>
      <nav class="header_container">
        <div
          style="width: 120px; display: flex; align-items: center; gap: 12px"
        >
          <img
            class="logo"
            src="{{ url_for('static', filename='image/logo.png') }}"
          />
          <span style="font-weight: 600; font-size: 18px"
            >Hola, {{ user }}</span
          >
        </div>
        <div
          style="
            width: 120px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
          "
        >
          <a href="/logout" class="header_btn"> Cerrar Sesión </a>
        </div>
      </nav>
    </header>
    <main class="container">
      <img
        src="{{ url_for('static', filename='image/cover.png') }}"
        style="
          width: 100%;
          height: 180px;
          object-fit: cover;
          border-radius: var(--radius);
        "
      />
      <h1>Empieza tu ruta</h1>
      <form action="/grafo" method="post" class="form_grafo">
        <div class="container">
          <label style="width: 100%;">
            Selecciona el tipo de recorrido
            <select name="tipo_ruta" required>
              <option value="todos">Pasar por todos los nodos</option>
              <option value="algunos">Pasar por algunos nodos</option>
              <option value="directo">
                Ir del inicio al destino (más corto)
              </option>
            </select>
          </label>
          <label style="width: 30%;">
            N° Nodos
            <input placeholder="Número de Nodos" type="number" name="num_nodos" min="2" required />
          </label>
        </div>

        <div class="container">
          <label style="width: 100%;">
            Seleccionar Diresa
            <select name="diresa" required>
              {% for diresa in diresas %}
              <option value="{{ diresa }}">{{ diresa }}</option>
              {% endfor %}
            </select>
          </label>

          <button type="submit" class="primary">Ver grafo en mapa</button>
        </div>
      </form>
    </main>
    <footer class="footer">
      <span> M.A.E - 2025 </span>
    </footer>
  </body>
</html>

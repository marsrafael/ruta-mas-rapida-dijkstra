<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Acceder | M.A.E</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='image/logo.png') }}">

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/index.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}"
    />
    <style>
      .__bg {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        object-fit: cover;
        z-index: -1;
        opacity: 0.2;
      }
      .error {
        background-color: rgba(255, 0, 0, .2);
        color: red;
        text-align: center;
        margin-top: 10px 0;
        padding: 8px 4px;
        border-radius: var(--radius);
      }
    </style>
  </head>
  <body>
    <div class="logo_container">
      <img
        class="logo"
        src="{{ url_for('static', filename='image/logo.png') }}"
      />
    </div>

    <form class="login_form" method="POST" action="/login">
      <h2 class="form_title">Acceder</h2>

      <label>
        Usuario
        <input type="name" name="user" placeholder="Usuario" required />
      </label>

      <label>
        Contraseña
        <input type="password" name="password" placeholder="Contraseña" type="password" required />
      </label>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <button type="submit" class="primary form-btn">Acceder</button>
    </form>

    <footer class="footer">
      <span> M.A.E - 2025 </span>
    </footer>

    <img
      class="__bg"
      src="{{ url_for('static', filename='image/background.jpg') }}"
    />
  </body>
</html>
